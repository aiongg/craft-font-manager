[workspace]
resolver = "3"
members = ["apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/aiongg/craft-font-manager"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
egui = "0.37"
eframe = { version = "0.37", default-features = false }
craft-font-manager = { git = "https://github.com/aiongg/craft-libs", rev = "b6d96f7df97212ed5d5ad8730a27e499fb9efa82" }
craft-ui = { git = "https://github.com/aiongg/craft-libs", rev = "b6d96f7df97212ed5d5ad8730a27e499fb9efa82" }
craft-fonts-build = { git = "https://github.com/aiongg/craft-libs", rev = "b6d96f7df97212ed5d5ad8730a27e499fb9efa82" }
log = "0.4"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# The suite's patched toolkit: bidi text, IME and font fixes on egui 0.37 and winit 0.30.
[patch.crates-io]
ecolor = { git = "https://github.com/aiongg/egui", rev = "a7bc087cf46779732dd59f4c0c3391e7bc34593c" }
eframe = { git = "https://github.com/aiongg/egui", rev = "a7bc087cf46779732dd59f4c0c3391e7bc34593c" }
egui = { git = "https://github.com/aiongg/egui", rev = "a7bc087cf46779732dd59f4c0c3391e7bc34593c" }
egui-wgpu = { git = "https://github.com/aiongg/egui", rev = "a7bc087cf46779732dd59f4c0c3391e7bc34593c" }
egui-winit = { git = "https://github.com/aiongg/egui", rev = "a7bc087cf46779732dd59f4c0c3391e7bc34593c" }
emath = { git = "https://github.com/aiongg/egui", rev = "a7bc087cf46779732dd59f4c0c3391e7bc34593c" }
epaint = { git = "https://github.com/aiongg/egui", rev = "a7bc087cf46779732dd59f4c0c3391e7bc34593c" }
epaint_default_fonts = { git = "https://github.com/aiongg/egui", rev = "a7bc087cf46779732dd59f4c0c3391e7bc34593c" }
# The suite's winit fork, pinned with that egui revision.
winit = { git = "https://github.com/aiongg/winit", rev = "8b35388bd719e8cc86a95971ba0bc026c9a8f058" }
