[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/aiongg/craft-font-manager"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
craft-font-manager-core = { path = "crates/core" }
craft-font-manager-ui = { path = "crates/ui" }
egui = "0.37"
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
craft-ui = { git = "https://github.com/aiongg/craft-libs", rev = "607d38a0ddffe195467c4117937915c5ab9095af" }
craft-i18n = { git = "https://github.com/aiongg/craft-libs", rev = "607d38a0ddffe195467c4117937915c5ab9095af" }
craft-fonts-build = { git = "https://github.com/aiongg/craft-libs", rev = "607d38a0ddffe195467c4117937915c5ab9095af" }
craft-font-catalog = { git = "https://github.com/aiongg/craft-libs", rev = "f44256663c85740da3cdbb44a859dc02a33b729f" }
craft-font-store = { git = "https://github.com/aiongg/craft-libs", rev = "f44256663c85740da3cdbb44a859dc02a33b729f" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# The suite's patched toolkit: bidi text, IME and font fixes on egui 0.37 and winit 0.30.
[patch.crates-io]
ecolor = { git = "https://github.com/aiongg/egui", rev = "aa1ba0b4b4d1c5e9dd04ef01e03b538677415deb" }
eframe = { git = "https://github.com/aiongg/egui", rev = "aa1ba0b4b4d1c5e9dd04ef01e03b538677415deb" }
egui = { git = "https://github.com/aiongg/egui", rev = "aa1ba0b4b4d1c5e9dd04ef01e03b538677415deb" }
egui-wgpu = { git = "https://github.com/aiongg/egui", rev = "aa1ba0b4b4d1c5e9dd04ef01e03b538677415deb" }
egui-winit = { git = "https://github.com/aiongg/egui", rev = "aa1ba0b4b4d1c5e9dd04ef01e03b538677415deb" }
egui_kittest = { git = "https://github.com/aiongg/egui", rev = "aa1ba0b4b4d1c5e9dd04ef01e03b538677415deb" }
emath = { git = "https://github.com/aiongg/egui", rev = "aa1ba0b4b4d1c5e9dd04ef01e03b538677415deb" }
epaint = { git = "https://github.com/aiongg/egui", rev = "aa1ba0b4b4d1c5e9dd04ef01e03b538677415deb" }
epaint_default_fonts = { git = "https://github.com/aiongg/egui", rev = "aa1ba0b4b4d1c5e9dd04ef01e03b538677415deb" }
# The winit commit egui's own Cargo.lock uses at that revision (branch craft/suite).
winit = { git = "https://github.com/aiongg/winit", rev = "616984d542c7a3274d1c0891aa43bdb0a9807d6b" }
